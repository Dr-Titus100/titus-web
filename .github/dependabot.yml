# Update pull requests for the site's packages and GitHub Actions, one a week for each. They go to dev,
# like every other change, and reach main through the usual dev to main pull request. A new version
# waits 14 days before Dependabot offers it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      site-packages:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
