name: Propose skill updates

# When a skill repo publishes a release, this opens a pull request that bumps the pinned tag and
# checksums in skills.config.json. Nothing deploys until Titus reviews and merges that pull request.

on:
  # Sent by the titus-humanizer release workflow, if its SITE_DISPATCH_TOKEN is still set.
  repository_dispatch:
    types: [skill-released]
  # Daily fallback, so a release is noticed even without that token.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-update
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: update
        run: node scripts/update-skills.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Open a pull request
        if: steps.update.outputs.summary != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.update.outputs.summary }}
        run: |
          branch="skill-update/$(date -u +%Y%m%d-%H%M)"
          if gh pr list --state open --search "Update pinned skills in:title" --json number --jq 'length' | grep -qv '^0$'; then
            echo "A skill update pull request is already open."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Update pinned skills: $SUMMARY"
          git push origin "$branch"
          body="Bumps $SUMMARY in skills.config.json, with new SHA-256 checksums.

          Before merging, read the release notes and the diff of the skill files. Merging deploys the new version.
          GitHub doesn't run checks on pull requests opened by this workflow. To run them, close and reopen this pull request."
          gh pr create --base main --head "$branch" --title "Update pinned skills: $SUMMARY" --body "$body" \
            || gh issue create --title "New skill release: $SUMMARY" --body "The branch $branch has the update, but this workflow couldn't open a pull request. Turn on Settings, Actions, General, \"Allow GitHub Actions to create and approve pull requests\", or open the pull request from the branch by hand."
