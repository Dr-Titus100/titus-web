name: Build and deploy

# Every action is pinned to a full commit SHA, with the release it matches in a comment.
# Dependabot (.github/dependabot.yml) opens pull requests when new releases come out.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the deploy job, which runs on main, gets the Pages permissions.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Downloads the skill files at the tag pinned in skills.config.json, checks their SHA-256
      # checksums, then builds. Nothing downloaded is run here.
      - run: npm run build
      - name: Check wording rules on the built pages
        run: node scripts/check-copy.mjs
      # After the move to Cloudflare, set the repository variable NEW_SITE_URL (Settings, then
      # Secrets and variables, then Actions, then Variables) to the new address, such as
      # https://example.com. GitHub Pages then serves only pages that forward each old address
      # to the same page on the new domain.
      - name: Build forwarding pages for the old address
        if: vars.NEW_SITE_URL != ''
        env:
          NEW_SITE_URL: ${{ vars.NEW_SITE_URL }}
        run: node scripts/make-forwarders.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: ${{ vars.NEW_SITE_URL != '' && 'dist-forward' || 'dist' }}

  # Runs the pinned scoring script on a sample to make sure it works. It runs in its own job with
  # read-only permissions, and it never writes into the site that gets deployed.
  check-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: node scripts/fetch-skills.mjs
      - run: node scripts/check-skills.mjs

  deploy:
    # Only main goes live. dev and pull requests only build, to catch problems early.
    if: github.ref == 'refs/heads/main'
    needs: [build, check-skills]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
